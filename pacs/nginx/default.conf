# Gateway del visor DICOM (HU21)
# - "/"           -> Bloqueado (no se permite volver al listado general de estudios)
# - "/viewer"     -> OHIF Viewer (solo para el estudio seleccionado)
# - "/dicom-web/" -> DICOMweb de Orthanc (QIDO-RS / WADO-RS), solo lectura y filtrado por estudio

server {
  listen 80;
  server_name _;

  # Los estudios pueden pesar cientos de MB: sin límite de body ni buffering
  client_max_body_size 0;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Impedir listado general de estudios o consulta de otros estudios del paciente (solo el StudyInstanceUID solicitado)
  location = /dicom-web/studies {
    limit_except GET HEAD OPTIONS {
      deny all;
    }

    if ($arg_StudyInstanceUID = "") {
      return 403;
    }

    proxy_pass http://orthanc:8042/dicom-web/studies;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
    proxy_buffering off;
    proxy_request_buffering off;

    add_header Cross-Origin-Resource-Policy same-origin always;
  }

  location /dicom-web/ {
    # Solo lectura desde el navegador: la carga de estudios se hace por Orthanc (puerto 8042 local)
    limit_except GET HEAD OPTIONS {
      deny all;
    }

    proxy_pass http://orthanc:8042/dicom-web/;
    # Orthanc arma las URLs de BulkData/Retrieve con el Host recibido
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
    proxy_buffering off;
    proxy_request_buffering off;

    # Requerido por OHIF v3 (SharedArrayBuffer) para recursos del mismo origen
    add_header Cross-Origin-Resource-Policy same-origin always;
  }

  # Bloquear acceso a la raíz (lista de estudios) para impedir volver atrás al listado general
  location = / {
    default_type text/html;
    return 403 '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Acceso restringido</title><style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}.card{background:#1e293b;padding:32px;border-radius:12px;max-width:460px;box-shadow:0 10px 25px rgba(0,0,0,.4)}h1{font-size:20px;margin:0 0 12px;color:#38bdf8}p{font-size:14px;line-height:1.5;color:#cbd5e1;margin:0}</style></head><body><div class="card"><h1>Visualizacion individual de estudio</h1><p>Por privacidad medica, el listado general de estudios esta deshabilitado. Seleccione un estudio especifico desde el Sistema Medico para visualizarlo.</p></div></body></html>';
  }

  location / {
    proxy_pass http://ohif:80/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
